[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated adversarial testing framework for Large Language Models"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff", "mypy"]

[project.scripts]
llm-redteam = "llm_redteam.cli:main"
