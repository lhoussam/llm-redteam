[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated adversarial testing framework for Large Language Models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Houssam Limy", email = "limy.houssam@gmail.com" }]
keywords = ["llm", "red-teaming", "jailbreak", "prompt-injection", "ai-security"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff", "mypy", "types-PyYAML"]

[project.urls]
Repository = "https://github.com/lhoussam/llm-redteam"

[project.scripts]
llm-redteam = "llm_redteam.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "UP042",  # keep `(str, Enum)`: switching to StrEnum would change how statuses render as strings
]

[tool.mypy]
files = ["llm_redteam"]
check_untyped_defs = true
disallow_untyped_defs = true
